template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=1.75 make -k check'
  fail_pattern: '^(---- \S+ stdout ----|(frame )?golden mismatch for seed \S+|xhash: FAIL|UNWINNABLE:|difficulty drift:|sim drift|sim \([a-z-]+\): \d+ runs stuck|FLIP INVERTED|error: tests/\S+ not found|size: FAIL|msrv: FAIL)'
  known_red: []
out_of_scope:
  - {glob: "Cargo.lock", reason: "generated by cargo from Cargo.toml"}
  - {glob: "rl144-*-upx", reason: "UPX-packed release artifacts, built from the source, never edited"}
  - {glob: "LICENSE", reason: "legal text, changed by the owner only"}
adoption:
  areas:
    - {name: docs, globs: ["docs/design/", "docs/story/", "docs/superpowers/"]}
nodes:
  - {id: E01, name: rng, track: done, status: imported, deps: [], owns: ["src/rng.rs"]}
  - {id: E02, name: content, track: done, status: imported, deps: [E01, E03], owns: ["src/content.rs"]}
  - {id: E03, name: gamedef, track: done, status: imported, deps: [], owns: ["src/gamedef.rs"]}
  - {id: E04, name: game, track: done, status: imported, deps: [E01, E02, E03], owns: ["src/game.rs"]}
  - {id: C01, name: contractor, track: done, status: imported, deps: [E03, E04], owns: ["src/games/contractor.rs"]}
  - {id: C02, name: games-seam, track: done, status: imported, deps: [C01], owns: ["src/games/mod.rs"]}
  - {id: S01, name: save, track: done, status: imported, deps: [E01, E04, C02], owns: ["src/save.rs"]}
  - {id: S02, name: headless, track: done, status: imported, deps: [E01, E02, E03, E04, C02], owns: ["src/headless.rs"]}
  - {id: P01, name: render, track: done, status: imported, deps: [E02, E04, C02], owns: ["src/render.rs"]}
  - {id: P02, name: backend-minifb, track: done, status: imported, deps: [E01, E02, E04, C02, S01, S02, P01], owns: ["src/backend_minifb.rs"]}
  - {id: P03, name: backend-term, track: done, status: imported, deps: [E01, E02, E04, C02, S01, S02, P01], owns: ["src/backend_term.rs"]}
  - {id: M01, name: main, track: done, status: imported, deps: [E01, E02, E03, E04, C01, C02, S01, S02, P01, P02, P03, M02], owns: ["src/main.rs"]}
  - {id: M02, name: goldens, track: done, status: imported, deps: [S02, P03], owns: ["tests/golden/"]}
  - {id: M03, name: bands, track: done, status: imported, deps: [S02], owns: ["tests/*-band.json"]}
  - {id: M04, name: replay-fixture, track: done, status: imported, deps: [S01], owns: ["tests/fixtures/"]}
  - {id: B01, name: build-config, track: done, status: imported, deps: [], owns: ["Cargo.toml", ".gitignore"]}
  - {id: B02, name: makefile, track: done, status: imported, deps: [B01, M01, M02, M03, M04], owns: ["Makefile"]}
  - {id: B03, name: project-guide, track: done, status: imported, deps: [B02], owns: ["CLAUDE.md"]}
