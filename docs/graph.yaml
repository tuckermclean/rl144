template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=1.75 make -k check'
  fail_pattern: '^(---- \S+ stdout ----|(frame )?golden mismatch for seed \S+|xhash: FAIL|UNWINNABLE:|difficulty drift:|sim drift|sim \([a-z-]+\): \d+ runs stuck|FLIP INVERTED|error: tests/\S+ not found|size: FAIL|msrv: FAIL)'
  known_red: []
out_of_scope:
  - {glob: "Cargo.lock", reason: "generated by cargo from Cargo.toml"}
  - {glob: "rl144-*-upx", reason: "UPX-packed release artifacts, built from the source, never edited"}
  - {glob: "LICENSE", reason: "legal text, changed by the owner only"}
adoption:
  areas:
    - {name: save-headless, globs: ["src/save.rs", "src/headless.rs"]}
    - {name: presentation, globs: ["src/render.rs", "src/backend_minifb.rs", "src/backend_term.rs"]}
    - {name: main-tests, globs: ["src/main.rs", "tests/"]}
    - {name: project, globs: ["Cargo.toml", "Makefile", ".gitignore", "CLAUDE.md"]}
    - {name: docs, globs: ["docs/design/", "docs/story/", "docs/superpowers/"]}
nodes:
  - {id: E01, name: rng, track: done, status: imported, deps: [], owns: ["src/rng.rs"]}
  - {id: E02, name: content, track: done, status: imported, deps: [E01, E03], owns: ["src/content.rs"]}
  - {id: E03, name: gamedef, track: done, status: imported, deps: [], owns: ["src/gamedef.rs"]}
  - {id: E04, name: game, track: done, status: imported, deps: [E01, E02, E03], owns: ["src/game.rs"]}
  - {id: C01, name: contractor, track: done, status: imported, deps: [E03, E04], owns: ["src/games/contractor.rs"]}
  - {id: C02, name: games-seam, track: done, status: imported, deps: [C01], owns: ["src/games/mod.rs"]}
